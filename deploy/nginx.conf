server {
    listen 80;
    server_name _;

    root /usr/share/nginx/html;
    index index.html;

    # AGENTS.md §11 — uploaded documents are served by the API through an
    # authorised route (§13). This location exists only so a guessed
    # /uploads/... path can never resolve to a file on disk.
    location /uploads/ {
        return 404;
    }

    location = /healthz {
        access_log off;
        add_header Content-Type text/plain;
        return 200 'ok';
    }

    # AGENTS.md §10 — API base prefix is /api/v1; nginx owns the prefix and
    # forwards only /api to Express.
    location /api/ {
        proxy_pass http://api:4000;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        # Exactly one hop, matching TRUST_PROXY_HOPS=1 so rate limiting keys off
        # the real client address.
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Request-Id      $request_id;

        proxy_connect_timeout 5s;
        proxy_read_timeout    60s;
    }

    location = /health { proxy_pass http://api:4000/health; access_log off; }
    location = /ready  { proxy_pass http://api:4000/ready;  access_log off; }

    # Hashed build assets are immutable.
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # AGENTS.md §3 — SPA fallback: client-side routing owns every other path.
    location / {
        add_header Cache-Control "no-store";
        try_files $uri $uri/ /index.html;
    }

    gzip on;
    gzip_types text/plain text/css application/javascript application/json image/svg+xml;
    gzip_min_length 1024;

    client_max_body_size 12m;
}